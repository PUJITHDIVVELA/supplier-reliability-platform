[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-reliability-platform"
version = "1.0.0"
description = "End-to-end platform for supplier reliability scoring with multi-signal evaluation, explainability, synthetic data generation, and audit validation."
authors = [{ name = "YottaFlex Candidate", email = "candidate@yottaflex.ai" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "tabulate>=0.9.0"
]

[project.scripts]
supplier-reliability = "supplier_reliability.cli:app"

[tool.setuptools.packages.find]
include = ["supplier_reliability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

